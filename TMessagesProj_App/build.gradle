import com.android.build.api.variant.FilterConfiguration

apply plugin: 'com.android.application'
apply plugin: 'org.telegram.build-app-plugin'

repositories {
    mavenCentral()
    google()
}

configurations.configureEach {
    exclude group: 'com.android.support', module: 'support-v4'
    exclude group: 'com.google.firebase', module: 'firebase-core'
    exclude group: 'androidx.recyclerview', module: 'recyclerview'
}

dependencies {
    implementation project(':TMessagesProj')
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}

android {
    defaultConfig.applicationId = APP_PACKAGE

    packaging {
        dex {
            useLegacyPackaging = true
        }
        jniLibs {
            useLegacyPackaging = true
        }
    }

    splits.abi {
        enable true
        universalApk false
        reset()
        if (rootProject.aoiAbis.size() > 1) {
            universalApk true
            include(*rootProject.aoiAbis)
        } else {
            include rootProject.aoiAbis.first()
        }
    }

    lint {
        disable += ['MissingTranslation', 'ExtraTranslation', 'BlockedPrivateApi']
        checkReleaseBuilds false
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
    }

    androidResources {
        noCompress += "pack"
        localeFilters += ["zz"]
    }

    signingConfigs {
        release {
            storeFile file("../TMessagesProj_App/release.keystore")
            storePassword rootProject.envOrLocal('RELEASE_STORE_PASSWORD')
            keyAlias rootProject.envOrLocal('RELEASE_KEY_ALIAS')
            keyPassword rootProject.envOrLocal('RELEASE_KEY_PASSWORD')
        }
    }

    buildTypes {
        configureEach {
            signingConfig signingConfigs.release
        }

        debug {
            applicationIdSuffix '.debug'
            debuggable true
            jniDebuggable true
            minifyEnabled false
            shrinkResources false
        }

        release {
            def minify = !providers.gradleProperty('skipR8').isPresent()
            debuggable false
            jniDebuggable false
            minifyEnabled minify
            shrinkResources minify
        }
    }

    defaultConfig.versionCode = rootProject.versionCode

    defaultConfig {
        versionName APP_VERSION_NAME

        proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), '../TMessagesProj/proguard-rules.pro'
        ndk.debugSymbolLevel = 'FULL'

        vectorDrawables.generatedDensities = ['mdpi', 'hdpi', 'xhdpi', 'xxhdpi']
    }

    buildFeatures {
        buildConfig = true
    }
    namespace 'org.telegram.messenger.regular'
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            def abi = output.filters.find { it.filterType == FilterConfiguration.FilterType.ABI }?.identifier ?: 'universal'
            output.outputFileName.set(output.versionName.zip(output.versionCode) { versionName, versionCode ->
                "Aoigram-${versionName}-${versionCode}-${abi}.apk".toString()
            })
        }
    }
}

apply plugin: 'com.google.gms.google-services'
