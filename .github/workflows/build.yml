name: Build

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      skip_r8:
        description: 'Skip R8 minification'
        type: boolean
        default: false
      target_abi:
        description: 'Target ABI'
        type: choice
        options:
          - universal
          - arm64-v8a
          - armeabi-v7a
          - x86_64
        default: 'universal'

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Gradle Build
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_HARDLINK: 'true'
      CCACHE_NOHASHDIR: 'true'
      CCACHE_MAXSIZE: 10G
      AOI_ABI: ${{ inputs.target_abi || 'universal' }}
      RELEASE_CHANNEL: ${{ github.ref_name == vars.STABLE_BRANCH && 'stable' || github.ref_name == vars.BETA_BRANCH && 'beta' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Checkout submodules
        run: git submodule update --init --recursive --depth 1
      - name: Compute native source key
        id: native_source
        run: echo "tree=$(git rev-parse HEAD:TMessagesProj/jni)" >> "$GITHUB_OUTPUT"
      - name: Set up Ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.native_source.outputs.tree }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}
          append-timestamp: false
      - name: Set up Gradle cache
        uses: actions/cache@v6
        with:
          path: ~/.gradle
          key: gradle-${{ hashFiles('**/*.gradle') }}
      - name: Restore keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          STORE_PASS: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > TMessagesProj_App/release.keystore
          else
            echo "RELEASE_KEYSTORE_BASE64 not set, generating a temporary release.keystore for CI..."
            keytool -genkey -v -keystore TMessagesProj_App/release.keystore \
              -alias "${KEY_ALIAS:-release}" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "${STORE_PASS:-android}" -keypass "${KEY_PASS:-android}" \
              -dname "CN=AoigramX, OU=AoigramX, O=AoigramX, L=Unknown, S=Unknown, C=US"
          fi
      - name: Modify Gradle JVM Args
        run: |
          MEMORY_GB=$(awk '/^MemTotal:/ {print int($2 / 1024 / 1024)}' /proc/meminfo)
          echo "Detected memory size: ${MEMORY_GB}GB"
          if [ $MEMORY_GB -ge 12 ]; then
            sed -i '/^org\.gradle\.jvmargs=/d' gradle.properties
            echo "org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=2G -XX:+UseParallelGC -Dfile.encoding=UTF-8" >> gradle.properties
          fi
          cat gradle.properties
      - name: Build
        id: build
        env:
          APP_ID: ${{ secrets.APP_ID || '442495' }}
          APP_HASH: ${{ secrets.APP_HASH || '873ffaceba76e791ff2491224a3cdb49' }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || 'android' }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'release' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || 'android' }}
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export BUILD_TIMESTAMP=$(date +%s)
          echo "build_timestamp=$BUILD_TIMESTAMP" >> "$GITHUB_OUTPUT"
          ./gradlew :TMessagesProj_App:assembleRelease ${{ inputs.skip_r8 && '-PskipR8' || '' }}
      - name: Attest build provenance
        continue-on-error: true
        uses: actions/attest@v4
        with:
          subject-path: |
            TMessagesProj_App/build/outputs/apk/release/*.apk
      - name: Upload arm64-v8a Artifact
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: arm64-v8a
          path: TMessagesProj_App/build/outputs/apk/release/*-arm64-v8a.apk
          if-no-files-found: ignore
      - name: Upload universal Artifact
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: universal
          path: TMessagesProj_App/build/outputs/apk/release/*-universal.apk
          if-no-files-found: ignore
      - name: Upload all release APKs
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: all-apks
          path: TMessagesProj_App/build/outputs/apk/release/*.apk
          if-no-files-found: warn
      - name: Notify release hook
        continue-on-error: true
        if: env.RELEASE_CHANNEL != ''
        env:
          BUILD_TIMESTAMP: ${{ steps.build.outputs.build_timestamp }}
          RELEASE_HOOK_URL: ${{ secrets.RELEASE_HOOK_URL }}
          RELEASE_HOOK_SECRET: ${{ secrets.RELEASE_HOOK_SECRET }}
        run: |
          OUTPUT_DIR=TMessagesProj_App/build/outputs/apk/release
          METADATA="$OUTPUT_DIR/output-metadata.json"
          sha256sum "$OUTPUT_DIR"/*.apk
          APKS=$(jq -c '.elements[] | {abi: ((.filters[] | select(.filterType == "ABI") | .value) // "universal"), file: .outputFile} | select(.abi == "arm64-v8a" or .abi == "universal")' "$METADATA" \
            | while read -r apk; do
                jq -c --arg sha256 "$(sha256sum "$OUTPUT_DIR/$(jq -r .file <<< "$apk")" | cut -d ' ' -f 1)" '{abi, sha256: $sha256}' <<< "$apk"
              done | jq -sc .)
          BODY=$(jq -nc \
            --argjson run_id "$GITHUB_RUN_ID" \
            --arg channel "$RELEASE_CHANNEL" \
            --arg sha "$GITHUB_SHA" \
            --argjson build_timestamp "$BUILD_TIMESTAMP" \
            --arg version_name "$(jq -r '.elements[0].versionName' "$METADATA")" \
            --argjson version_code "$(jq '.elements[0].versionCode' "$METADATA")" \
            --argjson apks "$APKS" \
            '$ARGS.named')
          SIGNATURE=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$RELEASE_HOOK_SECRET" | cut -d ' ' -f 2)
          curl --fail-with-body -sS -X POST \
            -H 'Content-Type: application/json' \
            -H "X-Signature-256: sha256=$SIGNATURE" \
            --data-binary "$BODY" \
            "$RELEASE_HOOK_URL/build"
